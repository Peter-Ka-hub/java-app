# Explicitly opt in with --spring.profiles.active=dev. Never deploy this profile.
spring:
  datasource:
    url: jdbc:h2:file:./data/school-diary;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false

logging:
  structured:
    format:
      console: ""
