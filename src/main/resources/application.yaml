spring:
  application:
    name: school-diary
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/school_diary}
    username: ${DATABASE_USERNAME:school_diary}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  h2:
    console:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict

app:
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    user-password: ${DEMO_USER_PASSWORD:}
  security:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window: ${LOGIN_WINDOW:1m}
      max-entries: ${LOGIN_MAX_TRACKED_ADDRESSES:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

springdoc:
  enable-default-api-docs: false
  swagger-ui:
    url: /openapi.json
    disable-swagger-default-url: true
