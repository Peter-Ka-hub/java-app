openapi: 3.2.0
info:
  title: OpenAPI description
  version: 1.0.0

paths:
  /api/schools:
    get:
      tags: [ school ]
      operationId: getSchools
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolResponse'
    post:
      tags: [ school ]
      operationId: createSchool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'

  /api/schools/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [ school ]
      operationId: getSchoolById
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
    put:
      tags: [school]
      operationId: updateSchool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
        '404':
          description: Not Found
    delete:
      tags: [school]
      operationId: deleteSchool
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found

components:
  schemas:
    SchoolType:
      type: string
      enum: [Primary, Secondary, Tertiary]

    SchoolRequest:
      type: object
      required: [ name ]
      properties:
        name: { type: string, maxLength: 50 }
        dateOfConstruction: { type: string, format: date }
        type: { $ref: '#/components/schemas/SchoolType' }

    SchoolResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        dateOfConstruction: { type: string, format: date }
        type: { $ref: '#/components/schemas/SchoolType' }

  /api/users:
    get:
      tags: [user]
      operationId: getUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'